/* ═══════════════════════════════════════════════════════
   소리 — 절차적 오디오 엔진
   ═══════════════════════════════════════════════════════ */
const AU = {
  ctx:null, master:null, sfx:null, mus:null, verb:null, started:false,
  on:true, sfxVol:0.75, musVol:0.34,
  init(){
    if(this.ctx) return true;
    try{
      const C = window.AudioContext||window.webkitAudioContext;
      if(!C) return false;
      const c = new C(); this.ctx = c;

      const comp = c.createDynamicsCompressor();
      comp.threshold.value=-15; comp.knee.value=22; comp.ratio.value=4.5;
      comp.attack.value=0.004; comp.release.value=0.22;

      this.master = c.createGain(); this.master.gain.value = this.on?0.9:0;
      comp.connect(this.master); this.master.connect(c.destination);

      // 리버브 (절차적 임펄스)
      const len = Math.floor(c.sampleRate*1.35), buf = c.createBuffer(2,len,c.sampleRate);
      for(let ch=0;ch<2;ch++){
        const d = buf.getChannelData(ch);
        for(let i=0;i<len;i++){
          const t = i/len;
          d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.7) * (1 - t*0.25);
        }
      }
      const cv = c.createConvolver(); cv.buffer = buf;
      const vg = c.createGain(); vg.gain.value = 0.9;
      cv.connect(vg); vg.connect(comp);
      this.verb = c.createGain(); this.verb.gain.value = 1; this.verb.connect(cv);

      this.sfx = c.createGain(); this.sfx.gain.value = this.sfxVol; this.sfx.connect(comp);
      this.mus = c.createGain(); this.mus.gain.value = this.musVol; this.mus.connect(comp);

      // 노이즈 버퍼 (재사용)
      const nl = Math.floor(c.sampleRate*1.2);
      this.noiseBuf = c.createBuffer(1,nl,c.sampleRate);
      const nd = this.noiseBuf.getChannelData(0);
      for(let i=0;i<nl;i++) nd[i] = Math.random()*2-1;
      return true;
    }catch(e){ return false; }
  },
  resume(){
    if(!this.init()) return;
    if(this.ctx.state==="suspended") this.ctx.resume().catch(()=>{});
    this.started = true;
  },
  setOn(v){
    this.on=v; if(!this.ctx) return;
    this.master.gain.cancelScheduledValues(this.ctx.currentTime);
    this.master.gain.setTargetAtTime(v?0.9:0, this.ctx.currentTime, 0.04);
  },
  setSfx(v){ this.sfxVol=v; if(this.sfx) this.sfx.gain.setTargetAtTime(v,this.ctx.currentTime,0.03); },
  setMus(v){ this.musVol=v; if(this.mus) this.mus.gain.setTargetAtTime(v*(MUS.duck?0.35:1),this.ctx.currentTime,0.05); },
  duckMusic(d){ MUS.duck=d; if(this.mus&&this.ctx)
    this.mus.gain.setTargetAtTime(this.musVol*(d?0.35:1), this.ctx.currentTime, 0.12); },
};

/* 기본 보이스 */
function pannerFor(pan, bus){
  const c = AU.ctx;
  let node = null;
  if(pan!=null && c.createStereoPanner){ node = c.createStereoPanner(); node.pan.value = Math.max(-1,Math.min(1,pan)); }
  const dest = bus || AU.sfx;
  if(node){ node.connect(dest); return node; }
  return dest;
}
function tone(o){
  if(!AU.ctx||!AU.on) return;
  const c=AU.ctx, t0=c.currentTime+(o.delay||0);
  const osc=c.createOscillator(), g=c.createGain();
  osc.type=o.type||"triangle";
  osc.frequency.setValueAtTime(o.f, t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2), t0+(o.dur||.2));
  if(o.detune) osc.detune.value=o.detune;
  const peak=(o.vol==null?.3:o.vol), a=o.a==null?.006:o.a, d=o.dur||.2;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak), t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  let chain=g;
  if(o.lp){ const f=c.createBiquadFilter(); f.type="lowpass"; f.frequency.value=o.lp; g.connect(f); chain=f; }
  osc.connect(g);
  const out=pannerFor(o.pan, o.bus);
  chain.connect(out);
  if(o.verb){ const s=c.createGain(); s.gain.value=o.verb; chain.connect(s); s.connect(AU.verb); }
  osc.start(t0); osc.stop(t0+a+d+0.05);
}
function noise(o){
  if(!AU.ctx||!AU.on) return;
  const c=AU.ctx, t0=c.currentTime+(o.delay||0);
  const src=c.createBufferSource(); src.buffer=AU.noiseBuf; src.loop=true;
  const f=c.createBiquadFilter();
  f.type=o.type||"bandpass"; f.frequency.setValueAtTime(o.f||1200,t0);
  if(o.f2) f.frequency.exponentialRampToValueAtTime(Math.max(60,o.f2), t0+(o.dur||.15));
  f.Q.value=o.q==null?1:o.q;
  const g=c.createGain(), peak=(o.vol==null?.2:o.vol), d=o.dur||.15, a=o.a==null?.004:o.a;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak), t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  src.connect(f); f.connect(g);
  const out=pannerFor(o.pan, o.bus);
  g.connect(out);
  if(o.verb){ const s=c.createGain(); s.gain.value=o.verb; g.connect(s); s.connect(AU.verb); }
  src.start(t0); src.stop(t0+a+d+0.05);
}
/* 타일 좌표 → 스테레오 팬 */
function panAt(x,y){
  try{ const [sx]=iso(x,y,0); return Math.max(-.85,Math.min(.85,(sx/Math.max(1,V.w))*2-1)); }
  catch(e){ return 0; }
}

/* ── 배경음악 — 회사가 커질수록 레이어가 쌓인다 ──── */
const MUS = {
  timer:null, step:0, next:0, duck:false, playing:false,
  bpm:82,
  chords:[            // I - vi - IV - V  (C major)
    {root:130.81, notes:[261.63,329.63,392.00]},   // C
    {root:110.00, notes:[261.63,329.63,440.00]},   // Am
    {root:174.61, notes:[261.63,349.23,440.00]},   // F
    {root:196.00, notes:[246.94,293.66,392.00]},   // G
  ],
  penta:[523.25,587.33,659.25,783.99,880.00,1046.5],
  start(){
    if(this.playing||!AU.ctx) return;
    this.playing=true; this.step=0; this.next=AU.ctx.currentTime+0.1;
    this.timer=setInterval(()=>this.sched(),25);
  },
  stop(){
    this.playing=false;
    if(this.timer){ clearInterval(this.timer); this.timer=null; }
  },
  sched(){
    if(!AU.ctx||!AU.on) return;
    const spb=60/this.bpm, s8=spb/2;
    while(this.next < AU.ctx.currentTime+0.14){
      this.play(this.step, this.next);
      this.next += s8; this.step=(this.step+1)%32;
    }
  },
  play(st, t){
    const bar=Math.floor(st/8), beat=st%8;
    const ch=this.chords[bar];
    const crew=S?S.emps.length:1;
    const B=AU.mus;
    const at=(o)=>{ o.bus=B; o.delay=Math.max(0,t-AU.ctx.currentTime); tone(o); };
    const an=(o)=>{ o.bus=B; o.delay=Math.max(0,t-AU.ctx.currentTime); noise(o); };

    // 베이스 (매 박)
    if(beat%2===0) at({f:ch.root, type:"sine", dur:.42, vol:.16, a:.012, lp:600});
    // 패드 (마디 머리)
    if(beat===0) ch.notes.forEach((f,i)=>
      at({f, type:"triangle", dur:1.5, vol:.045, a:.22, lp:1800, verb:.5, detune:i*3}));
    // 플럭 멜로디 — 직원 2명 이상
    if(crew>=2 && [0,3,6].includes(beat)){
      const f=this.penta[(bar*2+beat)%this.penta.length];
      at({f, type:"triangle", dur:.3, vol:.075, a:.006, verb:.32});
      at({f:f*2, type:"sine", dur:.16, vol:.022, a:.004});
    }
    // 셰이커 — 4명 이상
    if(crew>=4 && beat%2===1)
      an({f:8200, type:"highpass", q:.5, dur:.05, vol:beat===3||beat===7?.05:.03, a:.004});
    // 킥 느낌의 저역 — 5명 이상
    if(crew>=5 && (beat===0||beat===4))
      at({f:78, f2:44, type:"sine", dur:.16, vol:.13, a:.003});
    // 카운터 멜로디 — 7명 이상
    if(crew>=7 && beat===5)
      at({f:this.penta[(bar+3)%this.penta.length]*1.5, type:"sine", dur:.42, vol:.05, a:.02, verb:.45});
    // 마감 임박이면 템포감 있는 하이햇
    if(S && S.phase==="work" && S.clock>DAY_LEN-14 && beat%1===0)
      an({f:9500, type:"highpass", q:.6, dur:.03, vol:.022, a:.002});
  },
};

          <span class="howto-d">틀리면 수수료의 1.5배를 물고 신뢰도가 6 떨어집니다. 신뢰도가 0이 되면 폐업.</span></span></div>
      </div>
      <p class="keyhint"><span class="kbd">A</span> 승인 · <span class="kbd">D</span> 반려 ·
        <span class="kbd">1~9</span> 반려 사유 · <span class="kbd">G</span> 규정집 ·
        <span class="kbd">S</span> 상점 · <span class="kbd">P</span> 일시정지</p>
      ${saved?`<button class="btn" id="mBtn">${saved.day}일차 이어하기</button>
               <div class="btn-row"><button class="btn ghost" id="mNew">처음부터 새로 시작</button></div>`
             :`<button class="btn" id="mBtn">첫 출근하기</button>`}
    </div>`);
  document.getElementById("mBtn").onclick=()=>{
    closeModal(); if(saved) applySave(saved); lastRoom=""; startDay(S.day);
  };
  const nb=document.getElementById("mNew");
  if(nb) nb.onclick=()=>{ closeModal(); S=newState(); lastRoom=""; startDay(1); };
}

(function boot(){
  loadSnd();
  const d=loadSave();
  if(d) applySave(d); else S=newState();
  S.phase="intro";
  S.emps.forEach(e=>{ const h=homeOf(e); e.x=h.x; e.y=h.y; });
  fitView(); update(); renderReasons(); renderPaper(); refreshRoomChip();
  try{ document.fonts.ready.then(()=>{ lastRoom=""; }); }catch(e){}
  AU.init(); paintSnd();
  requestAnimationFrame(loop);
  intro(false);
})();
</script>
